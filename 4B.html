<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, noimageindex">
<title>Fotos da turma 4B</title>
<style>
  :root {
    --papel:  #f1f3ee;
    --tinta:  #1f2a24;
    --verde:  #2f6f4e;
    --amarelo:#f4b52f;
    --linha:  #d6dbd3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 1.25rem 4rem;
    background: var(--papel);
    color: var(--tinta);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 68rem;
    margin: 0 auto;
    padding: 2.5rem 0 1.5rem;
    border-bottom: 3px solid var(--verde);
  }
  h1 {
    margin: 0;
    font-size: clamp(1.9rem, 6vw, 3rem);
    letter-spacing: -0.02em;
  }
  h1 em {
    font-style: normal;
    background: var(--amarelo);
    padding: 0 .35rem;
    border-radius: .2rem;
  }
  .contagem { margin: .4rem 0 0; }
  .acoes { margin-top: 1.1rem; }
  .tudo, .voltar {
    display: inline-block;
    margin-right: .75rem;
    padding: .55rem 1rem;
    border-radius: .4rem;
    text-decoration: none;
    font-weight: bold;
  }
  .tudo   { background: var(--verde); color: #fff; }
  .voltar { border: 2px solid var(--linha); color: var(--tinta); }
  .grade {
    max-width: 68rem;
    margin: 2rem auto 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
    gap: 1.5rem;
  }
  .foto { margin: 0; }
  .foto img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    border-radius: .5rem;
    background: #fff;
    border: 1px solid var(--linha);
  }
  figcaption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    margin-top: .55rem;
  }
  .autor { font-size: .95rem; }
  .baixar {
    flex: none;
    padding: .35rem .7rem;
    border-radius: .35rem;
    background: var(--amarelo);
    color: var(--tinta);
    text-decoration: none;
    font-size: .85rem;
    font-weight: bold;
  }
  a:hover, a:focus-visible { filter: brightness(.94); }
  a:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
  footer {
    max-width: 68rem;
    margin: 3rem auto 0;
    padding-top: 1.25rem;
    border-top: 1px solid var(--linha);
    font-size: .9rem;
  }
</style>
</head>
<body>
  <header>

    <p class="contagem">8 fotos. Toque na imagem para ver maior ou em Baixar para salvar no seu aparelho.</p>
    <div class="acoes">

      <a class="voltar" href="../">Voltar para as turmas</a>
    </div>
  </header>
