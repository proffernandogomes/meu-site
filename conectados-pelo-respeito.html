<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectados pelo Respeito — Jogo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EA;--ink:#2B2D42;--muted:#6b6f80;--c1:#6C5CE7;--c2:#00A884;--c3:#E68A00;--c4:#E17055;--c5:#0984E3;--good:#00A884;--bad:#E5484D;--gold:#F5B700;--r:20px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.35;background-image:radial-gradient(#f1dfbf 1.2px,transparent 1.2px);background-size:22px 22px;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:3px solid #f0e2c8;flex-wrap:wrap}
.brand{font-weight:800;font-size:22px;color:var(--c1)}.brand span{color:var(--c4)}
.right{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid #eadbbf;background:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 90px}
.hero{text-align:center;margin:10px 0 24px}.hero h1{font-size:clamp(34px,6vw,58px);margin:0;color:var(--c1);line-height:1.05}.hero h1 span{color:var(--c4)}.hero p{font-size:20px;margin:6px 0 0;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.mission{position:relative;border:none;border-radius:var(--r);padding:22px 16px 16px;background:var(--mc);color:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.mission:hover{transform:translateY(-4px)}.mission:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.m1{--mc:var(--c1)}.m2{--mc:var(--c2)}.m3{--mc:var(--c3)}.m4{--mc:var(--c4)}.m5{--mc:var(--c5)}
.num{position:absolute;top:8px;right:14px;font-size:30px;font-weight:800;opacity:.45}
.micon{font-size:46px;line-height:1.1}.mtitle{font-size:21px;font-weight:800;line-height:1.1}.mskill{font-size:15px;opacity:.92}
.mstar{margin-top:8px;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 12px;align-self:flex-start;font-weight:700}
.mission.done .mstar{background:#fff;color:var(--ink)}
.btn{border:none;border-radius:14px;padding:10px 18px;background:var(--c1);color:#fff;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid #e5d6ba;box-shadow:0 3px 0 #e5d6ba}
.btn.green{background:var(--good)}.btn.red{background:var(--bad)}.btn.gold{background:var(--gold);color:#3a2a00}.btn.big{font-size:22px;padding:14px 24px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.center{text-align:center;justify-content:center}
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:0 4px 0 #eadbbf;border:2px solid #f0e2c8;margin:14px 0}
.phead{display:flex;gap:14px;align-items:center;background:#fff;border-radius:var(--r);padding:14px 18px;border-left:10px solid var(--pc);box-shadow:0 4px 0 #eadbbf;margin-bottom:8px}
.pbadge{font-size:50px}.pnum{font-weight:700;color:var(--pc);font-size:15px}.phead h2{margin:0;font-size:clamp(24px,3.5vw,32px);line-height:1.1}.how{margin:4px 0 0;color:var(--muted)}
h3{margin:6px 0 8px}
.hint{color:var(--muted);margin:6px 0}
.fb{border-radius:14px;padding:12px 14px;margin-top:10px;font-size:18px;animation:pop .3s}.fb.good{background:#e7fbf4;border:2px solid var(--good)}.fb.bad{background:#ffecec;border:2px solid var(--bad)}.fb.info{background:#fff6d6;border:2px solid var(--gold)}
.note{background:#fff6d6;border-left:6px solid var(--gold);padding:10px 14px;border-radius:10px;margin:10px 0}

/* Missão 1 */
.story{display:flex;gap:14px;align-items:center;font-size:20px}.big-emoji{font-size:56px}
.p1-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:760px){.p1-grid{grid-template-columns:1fr}}
.bank{display:flex;flex-direction:column;gap:10px;min-height:60px}
.step{border:3px dashed var(--c1);background:#f4f2ff;border-radius:14px;padding:12px 14px;text-align:left;font-size:19px;font-weight:600;animation:pop .3s}
.slots{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.slot{counter-increment:s;background:#fff;border:3px solid var(--c1);border-radius:14px;padding:12px 14px 12px 54px;position:relative;min-height:56px;font-size:19px;font-weight:600;cursor:pointer}
.slot::before{content:counter(s);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800}
.slot.empty{border-style:dashed;opacity:.6;cursor:default}.ph{color:var(--muted)}
.slot.ok{border-color:var(--good);background:#e7fbf4}.slot.ok::before{background:var(--good)}
.slot.bad{border-color:var(--bad);background:#ffecec}.slot.bad::before{background:var(--bad)}

/* Missão 2 */
.levels{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #e5d6ba;font-weight:800}
.dot.ok{background:var(--good);border-color:var(--good);color:#fff}.dot.cur{border-color:var(--c2);color:var(--c2);transform:scale(1.15)}
.p2{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:20px;align-items:start}@media(max-width:820px){.p2{grid-template-columns:1fr}}
.board{position:relative;width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);background:#dff5ec;border-radius:16px;overflow:hidden;border:4px solid var(--c2)}
.cell{border:1px dashed #a8dcc8;display:grid;place-items:center;font-size:clamp(24px,6vw,40px)}
.cell.wall{background:#e8dcc6}
.cell.goal{background:#fff6d6;animation:pulse 1.4s infinite}
.robot{position:absolute;width:20%;height:20%;transition:left .4s ease,top .4s ease;display:grid;place-items:center}
.rface{font-size:clamp(28px,7vw,46px);position:relative;z-index:2}
.arrowwrap{position:absolute;inset:0;transition:transform .35s ease}
.arrow{position:absolute;top:0;left:50%;transform:translateX(-50%);color:var(--c4);font-size:20px;line-height:1}
.robot.shake{animation:shake .5s}
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd{border:none;border-radius:14px;background:var(--c2);color:#fff;font-weight:800;padding:10px 6px;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.cmd span{font-size:32px;line-height:1.1}
.cmd:active{transform:translateY(2px)}.cmd:disabled{opacity:.45}
.prog{list-style:none;padding:10px;margin:0;display:flex;flex-wrap:wrap;gap:6px;min-height:64px;background:#f6fffb;border:3px dashed #a8dcc8;border-radius:14px}
.prog li{background:#fff;border:2px solid var(--c2);border-radius:10px;padding:2px 10px;font-weight:700;cursor:pointer;font-size:16px;transition:transform .2s}
.prog li small{opacity:.55;margin-right:4px}
.prog li.now{background:var(--c2);color:#fff;transform:scale(1.1)}.prog li.err{background:var(--bad);border-color:var(--bad);color:#fff}
.prog .empty-p{color:var(--muted);border:none;background:none;cursor:default}
.msgcard{font-size:26px;text-align:center;background:#fff;border:4px solid var(--gold);border-radius:16px;padding:16px;margin:8px 0;animation:pop .5s;font-weight:800}

/* Missão 3 */
.progress{height:14px;background:#fff;border-radius:99px;overflow:hidden;border:2px solid #eadbbf;margin-top:10px}.progress div{height:100%;background:var(--c3);transition:width .4s}
.situ{text-align:center;padding:30px 18px}.sn{color:var(--muted);font-weight:700}.st{font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.15}
.situ.shake{animation:shake .5s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}@media(max-width:640px){.bins{grid-template-columns:1fr}}
.bin{border-radius:var(--r);padding:12px 14px;min-height:120px}.bin.good{background:#e7fbf4;border:3px solid var(--good)}.bin.bad{background:#ffecec;border:3px solid var(--bad)}
.bin ul{margin:0;padding-left:22px}.bin li{margin:4px 0;animation:pop .4s}
.challenge label{display:block;margin:10px 0;font-weight:600}
input.txt{font:inherit;font-size:20px;padding:8px 12px;border:3px solid #e5d6ba;border-radius:12px;width:100%;margin-top:4px;background:#fffdf8;color:var(--ink)}
input.txt:focus{outline:none;border-color:var(--c1)}

/* Missão 4 */
.problem{background:var(--c4);color:#fff;border-radius:var(--r);padding:14px 18px;font-size:20px;font-weight:700;text-align:center;margin-top:14px}
.pieces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px}@media(max-width:640px){.pieces{grid-template-columns:repeat(2,1fr)}}
.piece{background:#fff;border:3px dashed var(--c4);border-radius:14px;padding:8px;text-align:center;font-weight:700;font-size:16px;opacity:.55;transition:transform .2s}
.piece.cur{opacity:1;border-style:solid;transform:scale(1.04)}.piece.done{opacity:1;background:#fdeee9;border-style:solid}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.opt{border:3px solid #e5d6ba;background:#fff;border-radius:14px;padding:12px 14px;text-align:left;font-size:19px;font-weight:600}
.opt.sel{border-color:var(--c4);background:#fdeee9}.opt.sel::after{content:' ✔';color:var(--c4);font-weight:800}
.opt.no{animation:shake .5s;border-color:var(--bad);background:#ffecec}
.swatches{display:flex;gap:10px;margin:6px 0}.sw{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #e5d6ba}.sw.sel{box-shadow:0 0 0 4px var(--ink)}
.poster{background:#fff;border:8px solid var(--pc);border-radius:24px;padding:20px;text-align:center;margin:12px 0}
.ptitle{font-size:clamp(28px,5vw,46px);font-weight:800;color:var(--pc);line-height:1.05}.pgroup{font-size:20px;color:var(--muted);margin-bottom:6px}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}@media(max-width:600px){.pcols{grid-template-columns:1fr}}
.poster h4{margin:12px 0 6px;font-size:20px}.poster ul{margin:0;padding-left:22px}
.pacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:600px){.pacts{grid-template-columns:1fr}}
.pact{background:var(--pc);color:#fff;border-radius:16px;padding:14px 10px;font-weight:800;font-size:19px}
.mural{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.mural .poster{font-size:14px;padding:12px;margin:0}.mural .ptitle{font-size:24px}.mural .pact{font-size:14px;padding:8px}.mural .poster h4{font-size:16px}.mural .pcols{grid-template-columns:1fr}
.poster:fullscreen{overflow:auto;display:flex;flex-direction:column;justify-content:center;padding:40px;font-size:26px;border-radius:0}
.poster:fullscreen .ptitle{font-size:64px}.poster:fullscreen .pact{font-size:30px;padding:24px}

/* Missão 5 */
.keygrid{display:grid;grid-template-columns:repeat(13,1fr);gap:6px}@media(max-width:700px){.keygrid{grid-template-columns:repeat(7,1fr)}}
.k{background:#eaf4ff;border:2px solid #b9dafb;border-radius:10px;text-align:center;padding:4px 0;line-height:1.1}.k b{display:block;font-size:22px;color:var(--c5)}.k span{font-weight:700}
.code{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.cn{background:var(--c5);color:#fff;font-weight:800;font-size:24px;border-radius:12px;width:62px;text-align:center;padding:4px 0}
.cl{width:62px;height:62px;text-align:center;font:inherit;font-size:32px;font-weight:800;text-transform:uppercase;border:3px solid #e5d6ba;border-radius:12px;background:#fffdf8;color:var(--ink)}
.cl:focus{outline:none;border-color:var(--c5)}
.cl.ok{border-color:var(--good);background:#e7fbf4}.cl.bad{border-color:var(--bad);background:#ffecec}
.out{font-size:24px;font-weight:800;letter-spacing:1px;background:#eaf4ff;border-radius:12px;padding:12px;margin:10px 0;min-height:56px;word-break:break-word;color:var(--c5)}
.reveal{font-size:clamp(36px,7vw,56px);font-weight:800;color:var(--c5);text-align:center;letter-spacing:6px;animation:pop .6s}

/* Certificado */
.cert{background:#fff;border:10px double var(--gold);border-radius:24px;padding:30px;text-align:center;max-width:820px;margin:0 auto}
.cert h1{font-size:clamp(40px,7vw,58px);margin:0;color:var(--c1);line-height:1}.cert .sub{font-size:24px;color:var(--c4);font-weight:800}
.cname{text-align:center;font:inherit;font-size:32px;font-weight:800;border:none;border-bottom:3px solid var(--ink);width:100%;max-width:520px;background:transparent;color:var(--ink);margin:6px 0}
.cname:focus{outline:none;border-color:var(--c1)}
.cstars{font-size:42px}
.tag{display:inline-block;background:#f4f2ff;color:var(--c1);border-radius:99px;padding:2px 12px;margin:3px;font-weight:700;font-size:16px}
.cert:fullscreen{overflow:auto;display:flex;flex-direction:column;justify-content:center;max-width:none;border-radius:0}

/* Modal, toast, confete */
.modal{position:fixed;inset:0;background:rgba(43,45,66,.55);display:grid;place-items:center;z-index:50;padding:16px}.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:24px;padding:24px;max-width:760px;width:100%;max-height:90vh;overflow:auto;animation:pop .35s}
.modal-box h2{text-align:center;margin:0 0 8px}
.celebrate{font-size:80px;text-align:center;animation:spin .8s}
table.t{width:100%;border-collapse:collapse;font-size:17px}.t td,.t th{border-bottom:1px solid #eee;padding:6px;text-align:left}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,200%);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;transition:transform .3s,opacity .3s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}#toast.bad{background:var(--bad)}#toast.good{background:var(--good)}
.conf{position:fixed;top:-50px;font-size:28px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{50%{background:#ffe9a8}}
@keyframes spin{from{transform:rotate(-40deg) scale(.3)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <button id="btnHome" class="chip">🏠 Mapa</button>
  <div class="brand">Conectados <span>pelo Respeito</span></div>
  <div class="right">
    <span id="stars" class="chip">⭐ 0/5</span>
    <button id="btnSound" class="chip" aria-label="Ligar ou desligar som">🔊</button>
    <button id="btnTeacher" class="chip">👩‍🏫 Professor</button>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

<script>
/* ---------- utilidades ---------- */
const app = document.getElementById('app');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();

const state = { stars: [false,false,false,false,false], sound: true, mural: [] };
try { const s = JSON.parse(localStorage.getItem('cpr-stars')); if (Array.isArray(s) && s.length === 5) state.stars = s; } catch (e) {}
try { const m = JSON.parse(localStorage.getItem('cpr-mural')); if (Array.isArray(m)) state.mural = m; } catch (e) {}
function save() { try { localStorage.setItem('cpr-stars', JSON.stringify(state.stars)); localStorage.setItem('cpr-mural', JSON.stringify(state.mural)); } catch (e) {} }

let actx;
function beep(type) {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const seq = type === 'ok' ? [523,659,784] : type === 'win' ? [523,659,784,1047] : type === 'bad' ? [330,247] : [600];
    seq.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type === 'bad' ? 'square' : 'triangle'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(type === 'bad' ? 0.06 : 0.14, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}
function toast(msg, kind = '') { const t = $('#toast'); t.className = 'show ' + kind; t.innerHTML = msg; clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2800); }
function modal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.remove('hidden'); $('#modalBox').scrollTop = 0; }
function closeModal() { $('#modal').classList.add('hidden'); }
function confetti() {
  const em = ['⭐','🎉','💜','💚','✨','🧡','💙'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span'); s.className = 'conf'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (1.8 + Math.random() * 1.6) + 's'; s.style.animationDelay = (Math.random() * .5) + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4200);
  }
}
function fullscreen(el) { try { const p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen()); if (p && p.catch) p.catch(() => toast('Tela cheia não disponível aqui.')); } catch (e) { toast('Tela cheia não disponível aqui.'); } }
function updateStars() { $('#stars').textContent = `⭐ ${state.stars.filter(Boolean).length}/5`; }

const PHASES = [
  { title: 'O algoritmo da boa convivência', icon: '🧩', skill: 'Sequência lógica', color: 'var(--c1)' },
  { title: 'Robô do respeito', icon: '🤖', skill: 'Comandos e orientação', color: 'var(--c2)' },
  { title: 'Detetives das atitudes', icon: '🔎', skill: 'Classificação de informações', color: 'var(--c3)' },
  { title: 'Programando uma escola sem bullying', icon: '🏫', skill: 'Decomposição de problemas', color: 'var(--c4)' },
  { title: 'O código secreto da amizade', icon: '🔐', skill: 'Codificação e decodificação', color: 'var(--c5)' },
];
function head(i, how) {
  const p = PHASES[i];
  return `<div class="phead" style="--pc:${p.color}"><div class="pbadge">${p.icon}</div><div><div class="pnum">Missão ${i + 1} de 5 · ${p.skill}</div><h2>${p.title}</h2><p class="how">${how}</p></div></div>`;
}
function complete(i, extra) {
  state.stars[i] = true; save(); updateStars(); beep('win'); confetti();
  const all = state.stars.every(Boolean);
  modal(`<div class="celebrate">⭐</div><h2>Missão ${i + 1} concluída!</h2>${extra || ''}
    <div class="row center">${all ? '<button class="btn gold" id="mCert">🏅 Ver certificado</button>' : ''}${i < 4 ? '<button class="btn" id="mNext">Próxima missão ➜</button>' : ''}<button class="btn ghost" id="mHome">🏠 Mapa</button></div>`);
  $('#mHome').onclick = () => { closeModal(); renderHome(); };
  if ($('#mNext')) $('#mNext').onclick = () => { closeModal(); go(i + 1); };
  if ($('#mCert')) $('#mCert').onclick = () => { closeModal(); renderCert(); };
}
function go(i) { window.scrollTo(0, 0); [renderP1, renderP2, renderP3, renderP4, renderP5][i](); }

/* ---------- mapa ---------- */
function renderHome() {
  window.scrollTo(0, 0);
  const done = state.stars.filter(Boolean).length;
  app.innerHTML = `
  <section class="hero"><h1>Conectados <span>pelo Respeito</span></h1>

/* ---------- Missão 2: robô ---------- */
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];
const CMD = { F: { l: 'Avançar', i: '⬆️' }, L: { l: 'Virar à esquerda', i: '↶' }, R: { l: 'Virar à direita', i: '↷' } };
const LEVELS = [
  { start: [0,4,0], goal: [0,1], walls: [], msg: 'Respeite seus colegas.' },
  { start: [0,4,0], goal: [2,2], walls: [], msg: 'Ajude quem precisa.' },
  { start: [0,0,1], goal: [4,4], walls: [[2,0],[2,1],[2,2]], msg: 'Não use apelidos para machucar.' },
  { start: [2,4,0], goal: [2,0], walls: [[1,2],[2,2],[3,2]], msg: 'Respeite as diferenças.' },
  { start: [4,4,3], goal: [0,0], walls: [[0,2],[2,3],[1,1],[3,1],[2,2]], msg: 'Todos merecem participar.' },
];
function renderP2() {
  let lv = 0, prog = [], running = false, rob;
  const isWall = (L, x, y) => L.walls.some(w => w[0] === x && w[1] === y);
  function resetRobot() { const s = LEVELS[lv].start; rob = { x: s[0], y: s[1], d: s[2], rot: s[2] * 90 }; }
  function draw() {
    resetRobot();
    const L = LEVELS[lv], cells = [];
    for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
      const w = isWall(L, x, y), g = L.goal[0] === x && L.goal[1] === y;
      cells.push(`<div class="cell ${w ? 'wall' : ''} ${g ? 'goal' : ''}">${w ? '🪨' : g ? '✉️' : ''}</div>`);
    }
    app.innerHTML = head(1, 'Você é o <b>programador</b>! Monte os comandos e aperte <b>Executar</b> para levar o robô até a carta ✉️. A setinha vermelha mostra para onde ele está olhando. “Virar” gira o robô no lugar, sem andar.') + `
    <div class="levels">${LEVELS.map((_, k) => `<span class="dot ${k < lv ? 'ok' : k === lv ? 'cur' : ''}">${k + 1}</span>`).join('')}</div>
    <div class="p2">
      <div><div class="board">${cells.join('')}<div class="robot" id="robot"><div class="arrowwrap" id="aw"><div class="arrow">▲</div></div><div class="rface">🤖</div></div></div>
        <p class="hint">🪨 = pedra (o robô não passa) · Fase ${lv + 1} de 5</p></div>
      <div class="card" style="margin:0">
        <h3>Comandos</h3>
        <div class="cmds">${Object.entries(CMD).map(([k, c]) => `<button class="cmd" data-c="${k}"><span>${c.i}</span>${c.l}</button>`).join('')}</div>
        <h3 style="margin-top:14px">Meu programa <small class="hint" id="count"></small></h3>
        <ol class="prog" id="prog"></ol>
        <div class="row"><button class="btn green" id="run">▶ Executar</button><button class="btn ghost" id="undo">⌫ Apagar último</button><button class="btn ghost" id="clear">🗑️ Limpar</button></div>
        <div id="fb2"></div>
      </div>
    </div>
    <div class="note">👫 <b>Em duplas:</b> um aluno é o <b>programador</b> e lê os comandos em voz alta; o outro é o <b>robô</b> e anda no chão da sala, casa por casa.</div>`;
    placeRobot(); drawProg();
    $$('[data-c]').forEach(b => b.onclick = () => { if (running) return; if (prog.length >= 20) { toast('Máximo de 20 comandos!'); return; } prog.push(b.dataset.c); beep(); drawProg(); $('#fb2').innerHTML = ''; });
    $('#undo').onclick = () => { if (running) return; prog.pop(); drawProg(); };
    $('#clear').onclick = () => { if (running) return; prog = []; drawProg(); resetRobot(); placeRobot(); $('#fb2').innerHTML = ''; };
    $('#run').onclick = run;
  }
  function placeRobot() { const r = $('#robot'); r.style.left = rob.x * 20 + '%'; r.style.top = rob.y * 20 + '%'; $('#aw').style.transform = `rotate(${rob.rot}deg)`; }
  function drawProg() {
    $('#prog').innerHTML = prog.length ? prog.map((c, j) => `<li data-p="${j}"><small>${j + 1}</small>${CMD[c].i} ${CMD[c].l}</li>`).join('') : '<li class="empty-p">Toque nos comandos acima…</li>';
    $('#count').textContent = prog.length ? `(${prog.length} comando${prog.length > 1 ? 's' : ''})` : '';
    $$('[data-p]').forEach(li => li.onclick = () => { if (running) return; prog.splice(+li.dataset.p, 1); drawProg(); });
  }
  function lock(v) { running = v; $$('.cmd,#undo,#clear,#run').forEach(b => b.disabled = v); }
  function run() {
    if (running) return; if (!prog.length) { toast('Adicione comandos primeiro!'); return; }
    const L = LEVELS[lv]; lock(true); resetRobot(); placeRobot(); $('#fb2').innerHTML = ''; let k = 0;
    const step = () => {
      $$('#prog li').forEach((li, j) => li.classList.toggle('now', j === k));
      if (k >= prog.length) { lock(false); finish(); return; }
      const c = prog[k];
      if (c === 'L') { rob.d = (rob.d + 3) % 4; rob.rot -= 90; }
      else if (c === 'R') { rob.d = (rob.d + 1) % 4; rob.rot += 90; }
      else {
        const nx = rob.x + DIRS[rob.d][0], ny = rob.y + DIRS[rob.d][1];
        if (nx < 0 || ny < 0 || nx > 4 || ny > 4 || isWall(L, nx, ny)) { crash(k, nx < 0 || ny < 0 || nx > 4 || ny > 4); return; }

    const r = $('#robot'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake');
    $('#fb2').innerHTML = `<div class="fb bad">💥 <b>Ops! Comando errado no passo ${k + 1}</b> — o robô ${out ? 'ia sair do tabuleiro' : 'bateu na pedra'}.<br>
      🤔 O que acontece quando o robô recebe um comando errado? Como nossas palavras e atitudes podem afetar outra pessoa?
      <div class="row"><button class="btn ghost" id="back">↺ Voltar o robô ao início</button></div></div>`;
    $('#back').onclick = () => { resetRobot(); placeRobot(); $('#fb2').innerHTML = ''; drawProg(); };
  }
  function finish() {
    const L = LEVELS[lv];
    if (rob.x === L.goal[0] && rob.y === L.goal[1]) {
      beep('ok');
      $('#fb2').innerHTML = `<div class="fb good">🎯 Chegou! A carta diz:<div class="msgcard">✉️ ${L.msg}</div>
        <div class="row center"><button class="btn green" id="nextLv">${lv < 4 ? 'Próxima fase ➜' : 'Terminar missão ⭐'}</button></div></div>`;
      $('#nextLv').onclick = () => {
        if (lv < 4) { lv++; prog = []; draw(); }
        else complete(1, `<p style="text-align:center">Você encontrou todas as mensagens:</p><ul>${LEVELS.map(l => `<li><b>${l.msg}</b></li>`).join('')}</ul>
          <div class="note">💬 <b>Conversa final:</b> O que acontece quando o robô recebe um comando errado? Como nossas palavras e atitudes podem afetar outra pessoa?</div>`);
      };
    } else {
      beep('bad');
      $('#fb2').innerHTML = `<div class="fb info">🤖 O programa terminou, mas o robô parou longe da carta. Confira os comandos e tente de novo!
        <div class="row"><button class="btn ghost" id="back">↺ Voltar o robô ao início</button></div></div>`;
      $('#back').onclick = () => { resetRobot(); placeRobot(); $('#fb2').innerHTML = ''; drawProg(); };
    }
  }
  draw();
}

        <div class="row"><button class="btn ghost" id="prev">⬅ Voltar</button><button class="btn ghost" id="fs">🖥️ Tela cheia</button><button class="btn" id="pin">📌 Colocar no mural</button></div></div>`;
    }
    app.innerHTML = head(3, 'Um problema grande fica mais fácil quando dividimos em partes menores. Resolvam uma parte de cada vez!') + `
      <div class="problem">🧩 Problema: ${PROBLEM}</div>
      <div class="pieces">${pieces.map((p, i) => `<div class="piece ${showMural || i < step ? 'done' : i === step ? 'cur' : ''}">${showMural || i < step ? '✔️ ' : ''}${p}</div>`).join('')}</div>` + body;
    bind();
  }
  function bind() {
    $$('[data-o]').forEach(b => b.onclick = () => {
      const key = 's' + (step + 1), i = +b.dataset.o, o = P4[key][i];
      if (!o.ok) { beep('bad'); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); $('#fb4').innerHTML = `<div class="fb bad">🤔 ${o.w}</div>`; return; }
      if (sel[key].has(i)) sel[key].delete(i);
      else { if (key === 's3' && sel.s3.size >= 3) { toast('Escolham só 3 atitudes. Desmarquem uma para trocar.'); return; } sel[key].add(i); }
      beep(); b.classList.toggle('sel'); $('#fb4').innerHTML = '';
    });
    if ($('#nextS')) $('#nextS').onclick = () => {
      if (step === 0 && sel.s1.size < 3) { toast('Ainda falta perceber algo na situação. Leiam o problema de novo!', 'bad'); return; }
      if (step === 1 && sel.s2.size < 2) { toast('Marquem pelo menos duas pessoas que podem ajudar.', 'bad'); return; }
      if (step === 2 && sel.s3.size !== 3) { toast('Escolham exatamente 3 atitudes.', 'bad'); return; }
      beep('ok'); step++; draw();
    };
    if ($('#prev')) $('#prev').onclick = () => { step--; draw(); };
    if ($('#gname')) $('#gname').oninput = e => { group = e.target.value; const g = $('#poster .pgroup'); g.innerHTML = group ? 'Grupo: ' + esc(group) : '&nbsp;'; };
    $$('[data-col]').forEach(b => b.onclick = () => { color = +b.dataset.col; draw(); });
    if ($('#fs')) $('#fs').onclick = () => fullscreen($('#poster'));
    if ($('#pin')) $('#pin').onclick = () => { state.mural.push(current()); save(); beep('ok'); showMural = true; draw(); };
    if ($('#another')) $('#another').onclick = () => { step = 0; sel.s1.clear(); sel.s2.clear(); sel.s3.clear(); group = ''; color = (color + 1) % COLORS.length; showMural = false; draw(); };
    if ($('#fin4')) $('#fin4').onclick = () => complete(3, `<p style="text-align:center">Vocês dividiram um problema grande em <b>4 partes menores</b> e criaram soluções. Isso é <b>decomposição</b>!</p>
      <div class="note">🖼️ <b>Produto coletivo:</b> transformem os cartazes em um mural de verdade na sala: “Nossa turma é uma equipe!”.</div>`);
  }
  draw();
}

/* ---------- Missão 5: código ---------- */
function renderP5() {
  const CODE = [18,5,19,16,5,9,20,15]; const Lt = n => String.fromCharCode(64 + n);
  let solved = false;
  function encode(s) { return norm(s).split(/\s+/).filter(Boolean).map(w => [...w].filter(c => c >= 'A' && c <= 'Z').map(c => c.charCodeAt(0) - 64).join('-')).filter(Boolean).join('  /  '); }
  function decode(s) { return s.split('/').map(w => (w.match(/\d+/g) || []).map(n => (+n >= 1 && +n <= 26) ? Lt(+n) : '?').join('')).filter(Boolean).join(' '); }
  function draw() {
    app.innerHTML = head(4, 'Cada número representa uma letra. Use a chave para decifrar a mensagem secreta!') + `
      <div class="card"><h3>🔑 Chave do código</h3><div class="keygrid">${Array.from({ length: 26 }, (_, i) => `<div class="k"><b>${Lt(i + 1)}</b><span>${i + 1}</span></div>`).join('')}</div></div>
      <div class="card"><h3>🕵️ Mensagem secreta</h3><p class="hint">Escreva a letra embaixo de cada número.</p>
        <div class="code">${CODE.map((n, i) => `<div class="cbox"><div class="cn">${n}</div><input class="cl" data-i="${i}" maxlength="1" autocomplete="off" autocapitalize="characters" aria-label="Letra do número ${n}"></div>`).join('')}</div>
        <div id="fb5"></div></div>
      <div id="part2"></div>`;
    $$('.cl').forEach(inp => {
      inp.oninput = () => {
        const i = +inp.dataset.i, v = norm(inp.value).replace(/[^A-Z]/g, '').slice(-1); inp.value = v;
        inp.classList.remove('ok', 'bad');
        if (!v) return;
        if (v === Lt(CODE[i])) { inp.classList.add('ok'); beep(); const nx = $(`.cl[data-i="${i + 1}"]`); if (nx) nx.focus(); }
        else { inp.classList.add('bad'); }
        if (!solved && $$('.cl').every(x => x.classList.contains('ok'))) win();
      };
    });
  }
  function win() {
    solved = true; beep('win'); confetti();
    $('#fb5').innerHTML = `<div class="reveal">RESPEITO</div><p style="text-align:center">🎉 Vocês decifraram a mensagem!</p>`;
    $('#part2').innerHTML = `
      <div class="card"><h3>🏭 Fábrica de códigos</h3><p>Agora é sua vez: escreva uma mensagem positiva e veja ela virar código para um colega decifrar.</p>
        <div class="row">${['SEJA GENTIL', 'AMIZADE', 'TODOS JUNTOS'].map(s => `<button class="chip sug">${s}</button>`).join('')}</div>
        <input class="txt" id="enc" maxlength="40" placeholder="Digite sua mensagem">
        <div class="out" id="encOut"></div>
        <button class="btn ghost" id="copy">📋 Copiar código</button></div>
      <div class="card"><h3>🔓 Decifrador</h3><p>Recebeu um código de um colega? Digite os números separados por traço. Use <b>/</b> entre as palavras.</p>
        <input class="txt" id="dec" placeholder="Ex.: 1-13-9-26-1-4-5">
        <div class="out" id="decOut"></div></div>
      <div class="row center"><button class="btn big" id="fin5">✅ Concluir missão</button></div>`;
    $('#enc').oninput = e => { $('#encOut').textContent = encode(e.target.value); };
    $$('.sug').forEach(b => b.onclick = () => { $('#enc').value = b.textContent; $('#encOut').textContent = encode(b.textContent); beep(); });
    $('#dec').oninput = e => { $('#decOut').textContent = decode(e.target.value); };
    $('#copy').onclick = () => {
      const t = $('#encOut').textContent; if (!t) { toast('Escreva uma mensagem primeiro.'); return; }
      try { navigator.clipboard.writeText(t).then(() => toast('Código copiado!', 'good'), () => toast('Não deu para copiar aqui. Copie à mão 🙂')); } catch (e) { toast('Não deu para copiar aqui. Copie à mão 🙂'); }
    };
    $('#fin5').onclick = () => complete(4, `<p style="text-align:center">Uma informação pode ser representada por <b>códigos</b>. Quem conhece a chave consegue <b>codificar</b> e <b>decodificar</b>!</p>
      <div class="note">✉️ <b>Desafio:</b> cada aluno cria uma mensagem positiva em código no caderno e troca com um colega para decifrar.</div>`);
  }
  draw();
}

/* ---------- certificado ---------- */
function renderCert() {
  window.scrollTo(0, 0);
  const d = new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
  app.innerHTML = `<div class="cert" id="cert"><div style="font-size:70px">🏅</div><h1>Certificado</h1><div class="sub">Agente do Respeito</div>
    <p>Certificamos que</p><input class="cname" id="cname" placeholder="Escreva seu nome" maxlength="40">
    <p>completou as 5 missões do projeto <b>Conectados pelo Respeito</b>, usando o pensamento computacional para construir uma turma mais acolhedora.</p>
    <div class="cstars">⭐⭐⭐⭐⭐</div><div>${PHASES.map(p => `<span class="tag">${p.icon} ${p.skill}</span>`).join('')}</div>
    <p class="hint">${d}</p></div>
    <div class="row center"><button class="btn ghost" id="cfs">🖥️ Tela cheia</button><button class="btn" id="cmap">🏠 Mapa</button></div>`;
  $('#cfs').onclick = () => fullscreen($('#cert'));
  $('#cmap').onclick = renderHome;
  confetti(); beep('win');
}

/* ---------- área do professor ---------- */
function teacher() {
  modal(`<h2>👩‍🏫 Para o professor</h2>
    <p><b>Objetivo geral:</b> desenvolver o pensamento computacional, a cooperação e o respeito às diferenças, incentivando os alunos a reconhecer atitudes positivas e a buscar soluções para situações de desrespeito no ambiente escolar.</p>
    <h3>Organização das cinco aulas (≈ 50 min cada)</h3>
    <table class="t"><tr><th>Aula</th><th>Missão</th><th>Aprendizagem computacional</th></tr>
    ${PHASES.map((p, i) => `<tr><td>${i + 1}</td><td>${p.icon} ${p.title}</td><td>${p.skill}</td></tr>`).join('')}</table>
    <h3>Habilidades da BNCC (Computação)</h3>
    <ul><li><b>EF03CO01</b> — associar valores de códigos a representações de informações (Missão 5).</li>
    <li><b>EF03CO02</b> — criar e simular algoritmos em linguagem oral, escrita ou pictográfica (Missões 1, 2 e 3).</li>
    <li><b>EF03CO03</b> — aplicar a decomposição para resolver problemas complexos (Missão 4).</li></ul>
    <h3>Sugestão de uso</h3>
    <ul><li>Projete o jogo e resolva cada missão <b>coletivamente</b>, ou use em duplas no laboratório/tablets.</li>
    <li>Faça a versão desplugada antes ou depois (percurso no chão, tiras de papel, cartazes reais).</li>
    <li>O progresso (estrelas e mural) fica salvo apenas neste navegador.</li></ul>
    <h3>Cuidados pedagógicos</h3>
    <ul><li>Use personagens e situações fictícias, sem pedir que a turma identifique quem praticou ou sofreu bullying.</li>
    <li>Não exponha, constranja ou peça relatos públicos de alunos envolvidos.</li>
    <li>Valorize empatia, respeito, inclusão e a procura de um adulto de confiança.</li>
    <li>Se houver episódios concretos, compartilhe com a equipe pedagógica e siga os procedimentos da escola.</li></ul>
    <div class="note">As atividades são ações educativas de prevenção e convivência. Elas não substituem a intervenção e o acompanhamento da escola diante de situações de bullying.</div>
    <div class="row center"><button class="btn ghost" id="zero">🔄 Zerar progresso e mural</button><button class="btn" id="tclose">Fechar</button></div>`);
  $('#tclose').onclick = closeModal;
  $('#zero').onclick = function () {
    if (!this.dataset.c) { this.dataset.c = 1; this.textContent = '⚠️ Toque de novo para confirmar'; return; }
    state.stars = [false,false,false,false,false]; state.mural = []; save(); updateStars(); closeModal(); renderHome(); toast('Progresso zerado.');
  };
}

/* ---------- início ---------- */
$('#btnHome').onclick = renderHome;
$('#btnTeacher').onclick = teacher;
$('#btnSound').onclick = () => { state.sound = !state.sound; $('#btnSound').textContent = state.sound ? '🔊' : '🔇'; };
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
updateStars(); renderHome();
</script>
