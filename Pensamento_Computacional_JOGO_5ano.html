<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pensamento Computacional – 5º ano</title>
<style>
:root{--bg:#eaf4ff;--ink:#1f2937;--blue:#2a6fdb;--red:#e63946;--yel:#f4c20d;--grn:#2a9d4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Nunito','Carlito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;border:0;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

/* ---------- menu ---------- */
.mhead{padding:14px 22px 8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mhead h1{margin:0;font-size:clamp(22px,3.4vw,34px);color:var(--blue);line-height:1.05}
.mhead h1 small{display:block;font-size:.5em;color:#546;font-weight:600}
.mhead .sp{flex:1}
.total{background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 0 #cfe0f7}
.chip{background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:16px;color:#345;box-shadow:0 2px 0 #cfe0f7;display:flex;align-items:center;gap:8px}
.chip.off{opacity:.55}
.chip i{width:18px;height:18px;border-radius:50%;border:3px solid var(--blue);display:inline-block}
.chip:not(.off) i{background:var(--blue)}
.mbody{flex:1;overflow:auto;padding:4px 22px 24px;-webkit-overflow-scrolling:touch}
.sec{margin:12px 0 8px;font-size:20px;font-weight:800;color:#345;display:flex;align-items:center;gap:10px}
.sec b{background:var(--c);color:#fff;border-radius:999px;padding:2px 12px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:#fff;border-radius:20px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;box-shadow:0 4px 0 var(--c);border:3px solid var(--c);color:var(--ink)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c)}
.tile .n{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.tile .t{font-weight:800;font-size:17px;line-height:1.1;flex:1}
.stars{display:flex;gap:3px}
.stars svg{width:24px;height:24px}
.reset{margin:18px auto 0;display:block;background:transparent;color:#789;font-size:14px;text-decoration:underline;padding:8px}

/* ---------- jogo ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;box-shadow:0 2px 0 #d6e6fa}
.ib{width:54px;height:54px;border-radius:16px;background:#e8f1ff;display:flex;align-items:center;justify-content:center;flex:none}
.ib:active{background:#cfe0ff}
.ib svg{width:30px;height:30px}
.ib[disabled]{opacity:.35}
.ttl{flex:1;display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(18px,2.6vw,26px);min-width:0}
.ttl .num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.ttl span.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instr{display:flex;align-items:center;gap:12px;padding:10px 14px 4px}
.instr p{margin:0;font-size:clamp(18px,2.7vw,28px);font-weight:700;line-height:1.15;flex:1}
main{flex:1;min-height:0;padding:6px 14px;display:flex}
#stagewrap{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#stage{width:100%;height:100%;background:#fff;border-radius:22px;box-shadow:0 4px 0 #cfe0f7;touch-action:none;display:block}
#stage text{pointer-events:none}
.bar{display:flex;align-items:center;gap:12px;padding:8px 14px 12px;min-height:92px}
.pal{flex:1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.pbtn{width:74px;height:74px;border-radius:18px;background:#fff;box-shadow:0 4px 0 #cfe0f7;border:4px solid transparent;display:flex;align-items:center;justify-content:center;padding:0}
.pbtn svg{width:100%;height:100%}
.pal.sm .pbtn{width:58px;height:58px;border-radius:14px;border-width:3px}
.pbtn.sel{border-color:var(--blue);background:#e0efff;transform:translateY(-3px)}
.btns{display:flex;gap:10px;margin-left:auto}
.btn{height:66px;min-width:150px;padding:0 24px;border-radius:20px;background:var(--grn);color:#fff;font-size:24px;font-weight:800;box-shadow:0 5px 0 #1d7a38;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1d7a38}
.btn.sec{background:#fff;color:#345;box-shadow:0 5px 0 #cfe0f7;min-width:110px;font-size:20px}
.btn.sec:active{box-shadow:0 1px 0 #cfe0f7}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #1b4fa3}
.btn[disabled]{opacity:.5;pointer-events:none}
.toast{position:fixed;left:50%;top:132px;transform:translateX(-50%) translateY(-20px);background:#1f2937;color:#fff;padding:14px 26px;border-radius:999px;font-size:22px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center;z-index:5}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:#c0392b}
.toast.good{background:#1d7a38}

/* ---------- vitoria ---------- */
.win{position:fixed;inset:0;background:rgba(20,40,80,.55);display:none;align-items:center;justify-content:center;z-index:10}
.win.on{display:flex}
.card{background:#fff;border-radius:32px;padding:28px 34px;text-align:center;max-width:min(92vw,560px);box-shadow:0 10px 0 rgba(0,0,0,.12);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.card h2{margin:0 0 6px;font-size:clamp(30px,5vw,44px);color:var(--blue)}
.card p{margin:0 0 10px;font-size:20px;color:#456}
.big{display:flex;justify-content:center;gap:8px;margin:6px 0 16px}
.big svg{width:96px;height:96px}
.big svg.in{animation:starin .6s cubic-bezier(.2,1.8,.4,1) both}
.big svg:nth-child(2).in{animation-delay:.18s}.big svg:nth-child(3).in{animation-delay:.36s}
.cbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}
.conf{position:fixed;top:-20px;width:14px;height:20px;border-radius:3px;z-index:11;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}

/* ---------- corrida a dois ---------- */
.racebtn{display:flex;align-items:center;gap:14px;width:100%;margin:8px 0 2px;padding:14px 20px;border-radius:22px;background:linear-gradient(90deg,#2a6fdb,#e68a00);color:#fff;font-size:clamp(20px,3vw,26px);font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.18);text-align:left}
.racebtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.racebtn small{display:block;font-size:.62em;font-weight:600;opacity:.95}
.racebtn svg{width:40px;height:44px;flex:none}
.rcols{display:flex;gap:16px;flex-wrap:wrap}
.rcol{flex:1;min-width:300px;background:#fff;border-radius:24px;padding:14px;border:4px solid var(--pc);box-shadow:0 4px 0 var(--pc)}
.rcol h3{margin:0 0 10px;font-size:22px;color:var(--pc)}
.rcol h3 span{font-weight:700;color:#456;font-size:.8em}
.ranims{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ranim{background:#f4f8ff;border-radius:16px;padding:6px 2px 4px;border:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:14px;color:var(--ink)}
.ranim svg{width:100%;max-width:74px;height:auto}
.ranim.sel{border-color:var(--pc);background:#fff;transform:translateY(-3px);box-shadow:0 4px 0 var(--pc)}
.ranim.off{opacity:.3;pointer-events:none}
.rrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
.rn{background:#fff;border:4px solid #cfe0f7;border-radius:18px;padding:10px 18px;font-size:18px;font-weight:800;color:#345}
.rn small{display:block;font-size:.75em;font-weight:600}
.rn.sel{border-color:var(--blue);background:#e0efff;color:var(--blue)}
.rgo{display:block;margin:10px auto 0}
.rtrack{--tk:28px;flex:1;min-width:0}
.rtrack.lg{--tk:56px;width:min(80vw,480px);margin:6px auto 14px}
.rlane{display:flex;align-items:center;gap:8px;margin:3px 0}
.rbar{position:relative;flex:1;height:calc(var(--tk)*.72);background:#e8f1ff;border-radius:999px;border:3px solid transparent}
.rlane.act .rbar{border-color:var(--pc);background:#fff}
.rlane.l0{--pc:#2a6fdb}.rlane.l1{--pc:#e68a00}
.rtk{position:absolute;top:50%;margin-top:calc(var(--tk)/-2);width:var(--tk);height:var(--tk);transition:left 1.1s cubic-bezier(.3,1.35,.5,1)}
.rtk svg{width:100%;height:100%;display:block}
.rfl{position:absolute;right:6px;top:50%;margin-top:-11px;width:16px;height:22px;opacity:.85}
.rtrack.lg .rfl{width:22px;height:28px;margin-top:-14px}
.rsc{min-width:30px;text-align:center;font-weight:800;color:var(--pc);font-size:calc(var(--tk)*.66)}
#rhead{display:none}
.race #rhead{display:flex;flex:1;align-items:center;gap:12px;min-width:0}
.race .ttl,.race #bPrev,.race #bNext{display:none}
.rchip{display:flex;align-items:center;gap:8px;background:#fff;border:4px solid var(--pc);border-radius:999px;padding:2px 16px 2px 4px;font-weight:800;font-size:clamp(16px,2.3vw,22px);white-space:nowrap;color:var(--pc);flex:none}
.rchip svg{width:46px;height:46px}
.win.dark{background:rgba(20,40,80,.9)}
.rtime{flex:none;background:#fff;border-radius:16px;padding:3px 12px;font-weight:800;font-size:13px;line-height:1.15;text-align:center;border:3px solid #cfd8dc;color:#456;min-width:92px}
.rtime b{display:block;font-size:20px}
.rtime.b2{border-color:#2a9d4b;color:#1d7a38}.rtime.b1{border-color:#e68a00;color:#b36200}
.rbig svg{width:150px;height:150px}
.rcard h2{margin-bottom:4px}
</style>
</head>
<body>
<div id="app">

<section id="menu" class="screen on">
  <div class="mhead">
    <h1>Pensamento Computacional<small>Jogos de lógica para o 5º ano · 20 atividades</small></h1>
    <div class="sp"></div>
    <button class="chip" id="tgVoice"><i></i>Voz</button>
    <button class="chip" id="tgSnd"><i></i>Sons</button>
    <button class="chip" id="tgFull">Tela cheia</button>
    <div class="total" id="total"></div>
  </div>
  <div class="mbody" id="mbody"></div>
</section>

<section id="game" class="screen">
  <header class="top">
    <button class="ib" id="bHome" aria-label="Menu"><svg viewBox="0 0 32 32"><path d="M4 16 L16 5 L28 16 V28 H19 V19 H13 V28 H4 Z" fill="#2a6fdb"/></svg></button>
    <div class="ttl"><span class="num" id="gnum">1</span><span class="tx" id="gtitle"></span></div>
    <div id="rhead"></div><button class="ib" id="bPrev" aria-label="Anterior"><svg viewBox="0 0 32 32"><path d="M20 5 L8 16 L20 27 Z" fill="#2a6fdb"/></svg></button>
    <button class="ib" id="bNext" aria-label="Próxima"><svg viewBox="0 0 32 32"><path d="M12 5 L24 16 L12 27 Z" fill="#2a6fdb"/></svg></button>
  </header>
  <div class="instr">
    <button class="ib" id="bSay" aria-label="Ouvir"><svg viewBox="0 0 32 32"><path d="M4 12 H10 L18 5 V27 L10 20 H4 Z" fill="#2a6fdb"/><path d="M22 10 Q27 16 22 22" fill="none" stroke="#2a6fdb" stroke-width="3" stroke-linecap="round"/><path d="M25 6 Q32 16 25 26" fill="none" stroke="#2a6fdb" stroke-width="3" stroke-linecap="round"/></svg></button>
    <p id="itext"></p>
  </div>
  <main><div id="stagewrap"></div></main>
  <footer class="bar">
    <div class="pal" id="pal"></div>
    <div class="btns">
      <button class="btn sec" id="bReset">Limpar</button>
      <button class="btn blue" id="bDemo" style="display:none">▶ Ver</button>
      <button class="btn" id="bGo">Conferir</button>
    </div>
  </footer>
</section>
<section id="rsetup" class="screen">
  <div class="mhead">
    <button class="ib" id="rsBack" aria-label="Menu"><svg viewBox="0 0 32 32"><path d="M4 16 L16 5 L28 16 V28 H19 V19 H13 V28 H4 Z" fill="#2a6fdb"/></svg></button>
    <h1>Corrida a dois<small>Um tablet, dois jogadores · cada um escolhe um bichinho</small></h1>
  </div>
  <div class="mbody" id="rsbody"></div>
</section>
</div>

<div class="win dark" id="rturn"><div class="card rcard" id="rtCard">
  <div class="rbig" id="rtBig"></div>
  <h2 id="rtT"></h2>
  <p id="rtS"></p>
  <button class="btn" id="rtGo">Vamos!</button>
</div></div>
<div class="win" id="rwin"><div class="card rcard">
  <h2 id="rwT"></h2>
  <p id="rwP"></p>
  <p id="rwTime" style="font-weight:800;color:#345"></p>
  <div class="big" id="rwStars"></div>
  <div class="rtrack lg" id="rwTrack"></div>
  <button class="btn" id="rwNext">Passar a vez ▶</button>
</div></div>
<div class="win dark" id="rend"><div class="card rcard">
  <div class="rbig" id="reBig"></div>
  <h2 id="reT"></h2>
  <p id="reP"></p>
  <div class="rtrack lg" id="reTrack"></div>
  <div class="cbtns"><button class="btn sec" id="reMenu">Menu</button><button class="btn" id="reNew">Nova corrida</button></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="win" id="win"><div class="card">
  <h2 id="wt">Muito bem!</h2>
  <p id="wp">Você ganhou</p>
  <div class="big" id="wstars"></div>
  <div class="cbtns">
    <button class="btn sec" id="wMenu">Menu</button>
    <button class="btn sec" id="wAgain">Jogar de novo</button>
    <button class="btn" id="wNext">Próxima ▶</button>
  </div>
</div></div>

<script>
(()=>{
'use strict';
const R="#e63946",B="#2a6fdb",Y="#f4c20d",G="#2a9d4b",K="#222222",W="#ffffff";
const FONT="'Nunito','Carlito','DejaVu Sans',system-ui,sans-serif";
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={voice:store.get('pc5-voice',true),snd:store.get('pc5-snd',true),stars:store.get('pc5-stars',{})};

/* ---------------- sons ---------------- */
let ac=null;
function tone(f,t=0,d=.15,type='sine',v=.14){
  if(!S.snd)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    const t0=ac.currentTime+t;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.start(t0);o.stop(t0+d+.02);
  }catch(e){}
}
const sPop=()=>tone(660,0,.08,'sine',.12);
const sBad=()=>{tone(220,0,.18,'sawtooth',.08);tone(170,.15,.25,'sawtooth',.08)};
const sGood=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.25,'triangle',.16));
function say(t){
  if(!S.voice)return;
  try{const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}

/* ---------------- primitivas SVG ---------------- */
const txt=(x,y,s,size=16,anchor='middle',fill=K,weight='bold')=>`<text x="${x}" y="${y}" font-family="${FONT}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" fill="${fill}">${s}</text>`;
const circle=(cx,cy,d,fill,stroke=K,sw=2.5)=>`<circle cx="${cx}" cy="${cy}" r="${d/2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
const square=(cx,cy,d,fill,stroke=K,sw=2.5)=>`<rect x="${cx-d/2}" y="${cy-d/2}" width="${d}" height="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const triangle=(cx,cy,d,fill,stroke=K,sw=2.5)=>`<polygon points="${cx},${cy-d/2} ${cx+d/2},${cy+d/2} ${cx-d/2},${cy+d/2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const star=(cx,cy,d,fill,stroke=K,sw=2.5)=>{const ro=d/2,ri=d/4.2;let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?ri:ro;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`};
const SHC={circle:B,square:R,triangle:G,star:Y};
const shape=(k,cx,cy,d,fill)=>({circle,square,triangle,star})[k](cx,cy,d,fill);
const box=(x,y,w,h,rx=8,dash=false,fill=W,sw=2.5)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="#333" stroke-width="${sw}"${dash?' stroke-dasharray="6 5"':''}/>`;
const arrow=(d,cx,cy,s=1,fill=K)=>`<g transform="translate(${cx},${cy}) rotate(${{R:0,D:90,L:180,U:270}[d]}) scale(${s})"><polygon points="-16,-6 3,-6 3,-14 20,0 3,14 3,6 -16,6" fill="${fill}"/></g>`;
const line=(x1,y1,x2,y2,c='#333',w=2.5)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const dot=(x,y,r=5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#333" stroke-width="2.5"/>`;
const robotInner=(s=1)=>{let g=`<g transform="scale(${s})">`;
  g+=`<line x1="0" y1="-22" x2="0" y2="-15" stroke="${K}" stroke-width="3"/><circle cx="0" cy="-25" r="4" fill="${R}" stroke="${K}" stroke-width="2"/>`;
  g+=`<rect x="-24" y="-8" width="5" height="12" rx="2" fill="#78909c" stroke="${K}" stroke-width="2"/><rect x="19" y="-8" width="5" height="12" rx="2" fill="#78909c" stroke="${K}" stroke-width="2"/>`;
  g+=`<rect x="-20" y="-15" width="40" height="32" rx="8" fill="#b0bec5" stroke="${K}" stroke-width="2.5"/>`;
  for(const ex of [-8,8])g+=`<circle cx="${ex}" cy="-3" r="5.5" fill="#fff" stroke="${K}" stroke-width="2"/><circle cx="${ex}" cy="-3" r="2" fill="${K}"/>`;
  return g+`<line x1="-8" y1="9" x2="8" y2="9" stroke="${K}" stroke-width="2.5" stroke-linecap="round"/></g>`};
const rock=(cx,cy,s=1)=>{const p=[[-21,13],[-15,-9],[1,-19],[17,-9],[22,13]].map(([a,b])=>`${(a*s).toFixed(1)},${(b*s).toFixed(1)}`).join(' ');
  return `<g transform="translate(${cx},${cy})"><polygon points="${p}" fill="#9e9e9e" stroke="${K}" stroke-width="2.5" stroke-linejoin="round"/>${line(-6*s,-4*s,4*s,4*s,'#616161',2)}</g>`};
const basket=(cx,cy,c)=>`<path d="M${cx-30},${cy-30} Q${cx},${cy-62} ${cx+30},${cy-30}" fill="none" stroke="${K}" stroke-width="3"/><polygon points="${cx-38},${cy-24} ${cx+38},${cy-24} ${cx+28},${cy+30} ${cx-28},${cy+30}" fill="${c}" stroke="${K}" stroke-width="2.5" stroke-linejoin="round"/>`;
const tower=(cx,floor,n,size)=>{const cols=[R,B,Y,G,R,B];let s='';for(let i=0;i<n;i++)s+=square(cx,floor-size/2-i*size,size,cols[i%6],K,2);return s};
const apples=(x,y,n)=>{let s='';for(let i=0;i<n;i++){const cx=x+i*33;s+=circle(cx,y,28,R,K,2.2)+`<ellipse cx="${cx+5}" cy="${y-16}" rx="6" ry="3.5" fill="${G}" stroke="${K}" stroke-width="1.5" transform="rotate(-30 ${cx+5} ${y-16})"/>`}return s};
const leaves=(cx,y)=>`<ellipse cx="${cx-13}" cy="${y}" rx="11" ry="6" fill="${G}" stroke="${K}" stroke-width="2" transform="rotate(-25 ${cx-13} ${y})"/><ellipse cx="${cx+13}" cy="${y}" rx="11" ry="6" fill="${G}" stroke="${K}" stroke-width="2" transform="rotate(25 ${cx+13} ${y})"/>`;

function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}

/* ---- Slots: casas para preencher com itens da paleta ---- */
function Slots(cfg){
  const val={...(cfg.init||{})};const ids=cfg.slots.map(s=>s.id);
  let selS=null,tool=null,hl=null,bad={},g,ctx,svg;
  const firstEmpty=()=>cfg.cycle?null:(ids.find(i=>val[i]==null)??null);
  const one=s=>{const v=val[s.id],sel=selS===s.id||hl===s.id;
    let h=`<rect class="slot" data-id="${s.id}" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="8" fill="${bad[s.id]?'#ffe1e1':sel?'#e0efff':W}" stroke="${bad[s.id]?R:sel?B:'#444'}" stroke-width="${sel||bad[s.id]?4:2.5}"${v==null?' stroke-dasharray="6 5"':''}/>`;
    if(v!=null)h+=`<g pointer-events="none">${cfg.draw(v,s.x+s.w/2,s.y+s.h/2,s)}</g>`;return h};
  const draw=()=>{g.innerHTML=cfg.slots.map(one).join('')};
  const f={
    pal:cfg.cycle?null:cfg.pal,
    svg(){selS=firstEmpty();return cfg.slots.map(one).join('')},
    attach(_svg,_g,_ctx){svg=_svg;g=_g;ctx=_ctx;
      g.addEventListener('pointerdown',e=>{const el=e.target.closest('.slot');if(!el||ctx.locked())return;e.preventDefault();const id=el.dataset.id;
        if(cfg.cycle){val[id]=NEXTDIR[val[id]];sPop();draw();return}
        if(tool!=null){val[id]=tool;sPop();selS=null;draw();return}
        selS=id;sPop();draw();});
      ctx.palSel(null)},
    onPal(key){sPop();
      if(selS!=null){val[selS]=key;selS=firstEmpty();ctx.palSel(null);tool=null;draw()}
      else{tool=tool===key?null:key;ctx.palSel(tool)}},
    check(){if(ids.some(i=>val[i]==null))return{incomplete:true};
      const wrong=ids.filter(i=>cfg.ans&&val[i]!==cfg.ans[i]);return{ok:!wrong.length,wrong}},
    async clearWrong(w){bad={};w.forEach(i=>bad[i]=true);draw();g.classList.add('shake');await sleep(700);g.classList.remove('shake');
      w.forEach(i=>delete val[i]);bad={};selS=firstEmpty();tool=null;ctx.palSel(null);draw()},
    reset(){ids.forEach(i=>delete val[i]);Object.assign(val,cfg.init||{});bad={};tool=null;selS=firstEmpty();ctx&&ctx.palSel(null);g&&draw()},
    values(){return ids.map(i=>val[i]??null)},
    setHl(i){hl=i==null?null:ids[i%ids.length];if(g)draw()},
    solve(){ids.forEach(i=>val[i]=cfg.ans?cfg.ans[i]:cfg.solution[ids.indexOf(i)]);draw()}
  };
  return f;
}

/* ---- Toggles: tocar para marcar (X ou círculo) ---- */
function Toggles(cfg){
  const sel=new Set();let bad=new Set(),g,ctx;
  const mark=(it,isBad)=>{const c=isBad?'#999':(cfg.mark==='x'?R:'#f97316');
    if(cfg.mark==='x'){const px=it.w*.18,py=it.h*.18;return line(it.x+px,it.y+py,it.x+it.w-px,it.y+it.h-py,c,6)+line(it.x+it.w-px,it.y+py,it.x+px,it.y+it.h-py,c,6)}
    return `<rect x="${it.x-3}" y="${it.y-3}" width="${it.w+6}" height="${it.h+6}" rx="14" fill="none" stroke="${c}" stroke-width="5"/>`};
  const one=it=>`<g class="tg" data-id="${it.id}"><rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="#fff" fill-opacity="0.01"/>${sel.has(it.id)?mark(it,bad.has(it.id)):''}</g>`;
  const draw=()=>{g.innerHTML=cfg.items.map(one).join('')};
  return{
    svg(){return cfg.items.map(one).join('')},
    attach(_s,_g,_c){g=_g;ctx=_c;g.addEventListener('pointerdown',e=>{const el=e.target.closest('.tg');if(!el||ctx.locked())return;e.preventDefault();
      const it=cfg.items.find(i=>i.id===el.dataset.id);
      if(sel.has(it.id))sel.delete(it.id);else{if(cfg.radio)cfg.items.filter(o=>o.g===it.g).forEach(o=>sel.delete(o.id));sel.add(it.id)}
      sPop();draw()})},
    check(){
      if(cfg.need==='group'){const gs=[...new Set(cfg.items.map(i=>i.g))];for(const gg of gs)if(!cfg.items.some(i=>i.g===gg&&sel.has(i.id)))return{incomplete:true}}
      else if(!sel.size)return{incomplete:true};
      const wrong=cfg.items.filter(i=>sel.has(i.id)!==i.ok).map(i=>i.id);return{ok:!wrong.length,wrong}},
    async clearWrong(w){bad=new Set(w);draw();g.classList.add('shake');await sleep(700);g.classList.remove('shake');w.forEach(i=>sel.delete(i));bad=new Set();draw()},
    reset(){sel.clear();bad=new Set();g&&draw()},
    solve(){sel.clear();cfg.items.filter(i=>i.ok).forEach(i=>sel.add(i.id));draw()}
  };
}

/* ---- Links: arrastar o dedo para ligar ---- */
function Links(cfg){
  const pairs={};let g,svg,ctx,drag=null,bad=new Set();
  const cols=[B,R,G,'#f59e0b'];
  const inz=(z,p)=>p.x>=z[0]&&p.x<=z[0]+z[2]&&p.y>=z[1]&&p.y<=z[1]+z[3];
  const hit=(arr,p)=>arr.find(n=>inz(n.zone,p));
  const draw=()=>{let h='';cfg.left.forEach((l,i)=>{const r=pairs[l.id];if(!r)return;const rn=cfg.right.find(x=>x.id===r);
      h+=line(l.dot[0],l.dot[1],rn.dot[0],rn.dot[1],bad.has(l.id)?'#999':cols[i%4],6)});
    if(drag)h+=line(drag.x1,drag.y1,drag.x2,drag.y2,'#667',5);g.innerHTML=h};
  return{
    svg(){return ''},
    attach(_s,_g,_c){svg=_s;g=_g;ctx=_c;
      svg.addEventListener('pointerdown',e=>{if(ctx.locked())return;const p=svgPt(svg,e);
        let side='l',n=hit(cfg.left,p);if(!n){side='r';n=hit(cfg.right,p)}if(!n)return;
        e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}
        drag={side,n,x1:n.dot[0],y1:n.dot[1],x2:p.x,y2:p.y};sPop();draw()});
      svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svgPt(svg,e);drag.x2=p.x;drag.y2=p.y;draw()});
      const end=e=>{if(!drag)return;const p=svgPt(svg,e);const other=hit(drag.side==='l'?cfg.right:cfg.left,p);
        if(other){const l=drag.side==='l'?drag.n:other,r=drag.side==='l'?other:drag.n;
          for(const k of Object.keys(pairs))if(k===l.id||(!cfg.many&&pairs[k]===r.id))delete pairs[k];pairs[l.id]=r.id;sPop()}
        drag=null;draw()};
      svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end)},
    check(){if(cfg.left.some(l=>!pairs[l.id]))return{incomplete:true};
      const wrong=cfg.left.filter(l=>pairs[l.id]!==cfg.ans[l.id]).map(l=>l.id);return{ok:!wrong.length,wrong}},
    async clearWrong(w){bad=new Set(w);draw();g.classList.add('shake');await sleep(700);g.classList.remove('shake');w.forEach(i=>delete pairs[i]);bad=new Set();draw()},
    reset(){for(const k of Object.keys(pairs))delete pairs[k];bad=new Set();drag=null;g&&draw()},
    solve(){Object.assign(pairs,cfg.ans);draw()}
  };
}

/* ---- Paint: pintar com a cor escolhida ---- */
function Paint(cfg){
  const fill={};let tool=cfg.pal[0].key,g,ctx,bad=new Set();
  const one=t=>`<g class="pt" data-id="${t.id}">${t.draw(fill[t.id]||W,bad.has(t.id))}</g>`;
  const draw=()=>{g.innerHTML=cfg.targets.map(one).join('')};
  return{
    pal:cfg.pal,
    svg(){return cfg.targets.map(one).join('')},
    attach(_s,_g,_c){g=_g;ctx=_c;ctx.palSel(tool);
      g.addEventListener('pointerdown',e=>{const el=e.target.closest('.pt');if(!el||ctx.locked())return;e.preventDefault();
        const id=el.dataset.id,t=cfg.targets.find(x=>x.id===id);fill[id]=tool;sPop();el.innerHTML=t.draw(tool,false)})},
    onPal(k){tool=k;sPop();ctx.palSel(k)},
    check(){if(cfg.targets.some(t=>t.ans!==W&&!fill[t.id]))return{incomplete:true};
      const wrong=cfg.targets.filter(t=>(fill[t.id]||W)!==t.ans).map(t=>t.id);return{ok:!wrong.length,wrong}},
    async clearWrong(w){bad=new Set(w);draw();g.classList.add('shake');await sleep(700);g.classList.remove('shake');w.forEach(i=>delete fill[i]);bad=new Set();draw()},
    reset(){for(const k of Object.keys(fill))delete fill[k];bad=new Set();tool=cfg.pal[0].key;if(g){ctx.palSel(tool);draw()}},
    solve(){cfg.targets.forEach(t=>fill[t.id]=t.ans);draw()}
  };
}

/* ---- Digits: escrever números com o teclado ---- */
function Digits(cfg){
  const val={};const ids=cfg.fields.map(f=>f.id),F=Object.fromEntries(cfg.fields.map(f=>[f.id,f]));let sel=null,bad={},g,ctx;
  const first=()=>ids.find(i=>(val[i]||'').length<F[i].ans.length)??null;
  const one=f=>{const v=val[f.id]||'',on=sel===f.id,b=bad[f.id];
    let h=`<rect class="slot" data-id="${f.id}" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="8" fill="${b?'#ffe1e1':on?'#e0efff':W}" stroke="${b?R:on?B:'#444'}" stroke-width="${on||b?4:2.5}"${v===''?' stroke-dasharray="6 5"':''}/>`;
    if(v!==''){const fs=Math.min(f.h*.66,f.w*.92/(Math.max(2,v.length)*.58),cfg.fs||99);h+=`<g pointer-events="none">${txt(f.x+f.w/2,f.y+f.h/2+fs*.35,v,fs)}</g>`}
    return h};
  const draw=()=>{g.innerHTML=cfg.fields.map(one).join('')};
  const keys=['1','2','3','4','5','6','7','8','9','0','bk'];
  return{
    pal:keys.map(k=>({key:k,svg:k==='bk'?arrow('L',0,0,1.5):txt(0,15,k,44)})),
    svg(){sel=first();return cfg.fields.map(one).join('')},
    attach(_s,_g,_c){g=_g;ctx=_c;
      g.addEventListener('pointerdown',e=>{const el=e.target.closest('.slot');if(!el||ctx.locked())return;e.preventDefault();sel=el.dataset.id;sPop();draw()})},
    onPal(k){sPop();if(sel==null)sel=first();if(sel==null)return;let v=val[sel]||'';
      if(k==='bk'&&v===''){const k0=ids.indexOf(sel);for(let q=k0-1;q>=0;q--)if((val[ids[q]]||'')!==''){sel=ids[q];v=val[sel];break}}
      if(k==='bk')v=v.slice(0,-1);else if(v.length<F[sel].ans.length)v+=k;
      val[sel]=v;if(k!=='bk'&&v.length>=F[sel].ans.length){const nx=ids.find(i=>(val[i]||'').length<F[i].ans.length);if(nx!=null)sel=nx}
      draw()},
    check(){if(ids.some(i=>!(val[i]||'').length))return{incomplete:true};const wrong=ids.filter(i=>val[i]!==F[i].ans);return{ok:!wrong.length,wrong}},
    async clearWrong(w){bad={};w.forEach(i=>bad[i]=true);draw();g.classList.add('shake');await sleep(700);g.classList.remove('shake');w.forEach(i=>delete val[i]);bad={};sel=first();draw()},
    reset(){ids.forEach(i=>delete val[i]);bad={};sel=first();g&&draw()},
    solve(){ids.forEach(i=>val[i]=F[i].ans);draw()}
  };
}

/* ---- Prog: grade n x n, robô, flores e execução das setas ---- */
function Prog(cfg){
  const n=cfg.n||3,{x0,y0,cell,start}=cfg,via=cfg.via||[],rs=cell/56;let g,robot,trail,pos,got=new Set();
  const cc=(c,r)=>[x0+cell*(c+.5),y0+cell*(r+.5)];
  const setPos=(x,y)=>{pos=[x,y];robot.setAttribute('transform',`translate(${x},${y})`)};
  const tween=(to,ms)=>new Promise(res=>{const from=pos.slice(),t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;setPos(from[0]+(to[0]-from[0])*e,from[1]+(to[1]-from[1])*e);k<1?requestAnimationFrame(step):res()};requestAnimationFrame(step)});
  const isRock=(c,r)=>(cfg.rocks||[]).some(([a,b])=>a===c&&b===r);
  const isVia=(c,r)=>via.some(([a,b])=>a===c&&b===r);
  const api={
    cc,
    svg(){let s='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)s+=`<rect x="${x0+c*cell}" y="${y0+r*cell}" width="${cell}" height="${cell}" fill="${W}" stroke="#333" stroke-width="2.5"/>`;
      (cfg.rocks||[]).forEach(([c,r])=>s+=rock(...cc(c,r),rs));
      via.forEach(([c,r])=>{const [x,y]=cc(c,r);s+=`<g class="fl" data-k="${c},${r}">${flower(x,y,rs*1.15)}</g>`});
      if(cfg.star)s+=star(...cc(...cfg.star),cell*.66,Y);
      s+='<g class="trail"></g>';const [sx,sy]=cc(...start);
      s+=`<g class="robot" transform="translate(${sx},${sy})">${robotInner(Math.min(1.05,rs*.95))}</g>`;return s},
    attach(_s,_g){g=_g;robot=g.querySelector('.robot');trail=g.querySelector('.trail');pos=cc(...start)},
    reset(){if(!g)return;trail.innerHTML='';got.clear();g.querySelectorAll('.fl').forEach(e=>e.style.opacity=1);setPos(...cc(...start))},
    async animate(moves,onStep){api.reset();await sleep(250);let [c,r]=start;
      for(let i=0;i<moves.length;i++){onStep&&onStep(i);const [dc,dr]=DIRS[moves[i]],nc=c+dc,nr=r+dr;
        const out=nc<0||nc>=n||nr<0||nr>=n;
        if(out||isRock(nc,nr)){const [fx,fy]=cc(c,r),[tx,ty]=out?[fx+dc*cell*.45,fy+dr*cell*.45]:cc(nc,nr);
          await tween([fx+(tx-fx)*.6,fy+(ty-fy)*.6],260);sBad();await tween([fx,fy],260);onStep&&onStep(null);return{ok:false,reason:out?'out':'rock'}}
        const [px,py]=cc(c,r);trail.insertAdjacentHTML('beforeend',`<circle cx="${px}" cy="${py+cell*.3}" r="${Math.max(3,5*rs)}" fill="#9ec5ff"/>`);
        await tween(cc(nc,nr),480);tone(520+i*60,0,.1,'sine',.1);c=nc;r=nr;
        if(isVia(c,r)&&!got.has(c+','+r)){got.add(c+','+r);const el=g.querySelector(`.fl[data-k="${c},${r}"]`);if(el)el.style.opacity=.18;tone(988,0,.14,'triangle',.13)}
        await sleep(120)}
      onStep&&onStep(null);
      const atStar=cfg.star?(c===cfg.star[0]&&r===cfg.star[1]):true,all=got.size===via.length;
      return{ok:atStar&&all,reason:atStar&&all?'ok':(atStar?'flowers':'far'),end:[c,r]}}
  };
  return api;
}

function open(i){

  cur=i;attempts=0;busy=false;const d=A[i];a=d.build();feats=a.feats;

function setBtns(on){['#bGo','#bReset','#bDemo'].forEach(s=>{$(s).disabled=!on})}

async function win(){
  if(race)return raceWin(attempts===0?3:attempts===1?2:1);
  const stars=attempts===0?3:attempts===1?2:1;
  if(stars>(S.stars[cur]||0)){S.stars[cur]=stars;store.set('pc5-stars',S.stars)}
  sGood();
  const praise=['Muito bem!','Isso mesmo!','Parabéns!','Você é demais!','Arrasou!'];
  $('#wt').textContent=praise[Math.floor(Math.random()*praise.length)];
  $('#wp').textContent=stars===3?'Acertou de primeira!':'Você conseguiu!';
  $('#wstars').innerHTML=[1,2,3].map(k=>starSvg(k<=stars,96).replace('<svg',k<=stars?'<svg class="in"':'<svg')).join('');
  $('#wNext').style.display=cur<A.length-1?'':'none';
  $('#win').classList.add('on');
  const cols=[R,B,Y,G,'#ff8fab'];
  for(let k=0;k<46;k++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[k%5];
    c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4800)}
  say('Muito bem!');
}

async function check(){
  if(busy)return;
  if(a.run)return runProg();
  let incomplete=false;const res=feats.map(f=>f.check?f.check():{ok:true});
  if(res.some(r=>r.incomplete)){toast('Falta responder! Complete tudo.','');return}
  if(res.every(r=>r.ok)){
    if(a.afterOk){busy=true;setBtns(false);await a.prog.animate(a.demo);busy=false;setBtns(true)}
    return win()}
  attempts++;busy=true;sBad();toast('Quase! Tente de novo. O que está certo fica.','bad');
  for(let k=0;k<feats.length;k++)if(res[k]&&!res[k].ok&&res[k].wrong&&res[k].wrong.length)await feats[k].clearWrong(res[k].wrong);
  busy=false;
}

async function runProg(){
  const sl=a.slots;let m;
  if(a.moves){m=a.moves();if(typeof m==='string'){toast(m,'');return}}
  else{m=sl.values();if(a.rep&&!m.some(x=>x==null))m=Array.from({length:a.rep},()=>m).flat()}
  if(m==null||m.some(x=>x==null)){toast('Escolha todas as setas primeiro!','');return}
  busy=true;setBtns(false);
  const r=await a.prog.animate(m,i=>{if(a.hl)a.hl(i);else sl.setHl(i)});
  if(r.ok){busy=false;setBtns(true);return win()}
  attempts++;
  toast(r.reason==='rock'?'Ops! O robô bateu na pedra.':r.reason==='out'?'Ops! O robô saiu do quadro.':r.reason==='flowers'?'Faltou pegar uma flor! Tente de novo.':'O robô não chegou na estrela. Tente de novo!','bad');
  await sleep(1200);a.prog.reset();busy=false;setBtns(true);
}

async function demo(){if(busy)return;busy=true;setBtns(false);await a.prog.animate(a.demo);await sleep(500);a.prog.reset();busy=false;setBtns(true)}

}
function raceWin(stars){
  const p=race.cur,info=rinfo(race.pl[p].k);clearInterval(race.tm);
  const secs=Math.round(race.el),bonus=attempts<=1?bonusFor(race.el):0,total=stars+bonus;race.pl[p].pts+=total;
  sGood();rConf();
  $('#rwT').textContent=`Muito bem, ${cap(info.n)}!`;
  $('#rwP').textContent=`${stars} de acerto + ${bonus} de rapidez = +${total} ponto${total>1?'s':''} para ${info.a} ${info.n}`;
  $('#rwTime').textContent=`Tempo de resposta: ${secs} segundo${secs===1?'':'s'}`;
  $('#rwStars').innerHTML=[1,2,3].map(k=>starSvg(k<=stars,84).replace('<svg',k<=stars?'<svg class="in"':'<svg')).join('');
  $('#rwNext').textContent=race.t>=race.rounds*2-1?'Ver o resultado':'Passar a vez ▶';
  renderTrack($('#rwTrack'),true);
  $('#rwin').classList.add('on');
  say(`Muito bem! ${total} ponto${total>1?'s':''} para ${info.a} ${info.n}!`);
}
function raceNext(){
  $('#rwin').classList.remove('on');race.t++;
  if(race.t>=race.rounds*2)return raceEnd();
  raceIntro();
}
function raceEnd(){
  $('#game').classList.remove('race');race.cur=-1;
  const [a0,a1]=race.pl,tie=a0.pts===a1.pts,w=a0.pts>a1.pts?0:1;
  if(tie){
    $('#reBig').innerHTML=racerSvg(a0.k)+racerSvg(a1.k);
    $('#reT').textContent='Empate! Os dois são campeões!';$('#reT').style.color=B;
    $('#reP').textContent=`${a0.pts} a ${a1.pts} pontos`;
  }else{
    const info=rinfo(race.pl[w].k);
    $('#reBig').innerHTML=racerSvg(info.k);
    $('#reT').textContent=`${cap(info.a)} ${info.n} venceu a corrida!`;$('#reT').style.color=PC[w];
    $('#reP').textContent=`${race.pl[w].pts} a ${race.pl[1-w].pts} pontos`;
  }
  race.pl.forEach(p=>p.shown=p.pts);renderTrack($('#reTrack'),false);
  $('#rend').classList.add('on');rConf();setTimeout(rConf,1200);
  say(tie?'Empate! Os dois são campeões!':`${cap(rinfo(race.pl[w].k).a)} ${rinfo(race.pl[w].k).n} venceu a corrida! Parabéns!`);
}
function raceQuit(){
  if(!confirm('Sair da corrida? A pontuação será perdida.'))return;
  if(race)clearInterval(race.tm);
  try{speechSynthesis.cancel()}catch(e){}
  race=null;$('#game').classList.remove('race');open(-1);
}
$('#mbody').addEventListener('click',e=>{if(e.target.closest('#bRace')){sPop();raceSetup()}});
$('#rsbody').addEventListener('click',e=>{
  const an=e.target.closest('.ranim');if(an){setup.p[+an.dataset.p]=an.dataset.k;sPop();buildSetup();return}
  const n=e.target.closest('.rn');if(n){setup.n=+n.dataset.n;sPop();buildSetup();return}
  if(e.target.closest('#rsGo')){sPop();startRace(setup.p[0],setup.p[1],setup.n)}
});
$('#rsBack').onclick=()=>open(-1);
$('#rtGo').onclick=raceStartTurn;
$('#rwNext').onclick=raceNext;
$('#reMenu').onclick=()=>{$('#rend').classList.remove('on');race=null;open(-1)};
$('#reNew').onclick=()=>{$('#rend').classList.remove('on');race=null;raceSetup()};

buildMenu();
window.__game={race:{startRace,get state(){return race}},A,open,check,get feats(){return feats},get a(){return a},get cur(){return cur},S,
  solveAndCheck:async()=>{feats.forEach(f=>f.solve&&f.solve());await check()}};
})();
</script>
</body>
